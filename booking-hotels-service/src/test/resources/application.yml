spring:
  cloud:
    config:
      enabled: false
  config:
    import: "optional:configtree:../config-server/src/main/resources/config/"
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

    liquibase:
      enabled: false
spring:
  datasource:
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB_NAME:analytics}
    username: ${CLICKHOUSE_USERNAME:analytics_user}
    password: ${CLICKHOUSE_PASSWORD:analytics_pass}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/booking-hotels-realm
          jwk-set-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/booking-hotels-realm/protocol/openid-connect/certs
  cloud:
    function:
      definition: consumer
    stream:
      kafka:
        binder:
          configuration:
            group.protocol: consumer
            max.poll.records: 500
            fetch.min.bytes: 1048576
            fetch.max.wait.ms: 5000
          brokers: ${KAFKA_BROKERS:localhost}:${KAFKA_PORT:9092}
          enableObservation: true
        bindings:
          consumer-in-0:
            consumer:
              configuration:
                value.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
                spring.json.value.default.type: "com.aleksey.statisticservice.kafka.model.StatisticModel"
                spring.json.trusted.packages: "com.aleksey.statisticservice.kafka.model"
              enable-dlq: true
              dlq-name: statistic.DLQ
              dlq-producer-properties:
                configuration:
                  key.serializer: org.apache.kafka.common.serialization.StringSerializer
                  value.serializer: org.springframework.kafka.support.serializer.JsonSerializer
      bindings:
        consumer-in-0:
          destination: statistic
          group: statistic-group
          consumer:
            batch-mode: true

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8070}/eureka/

server:
  port: ${SERVER_PORT:8181}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  observations:
    http:
      server:
        requests:
          write-trace-header: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:zipkin}:${ZIPKIN_PORT:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
    enabled-by-default: true